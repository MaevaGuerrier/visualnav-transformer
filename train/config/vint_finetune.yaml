project_name: vint-finetune
run_name: vint-5c
wandb_entity: kobakos
pretrained_weights: checkpoints/vint.pth
freeze_encoders: False

# training setup
use_wandb: True # set to false if you don't want to log to wandb
train: True
batch_size: 128
epochs: 25
gpu_ids: [0]
num_workers: 12
lr: 5e-5
optimizer: adamw
clipping: False
max_norm: 1.
scheduler:
seed: 0

# model params
model_type: vint
obs_encoder: "efficientnet-b0" # by default, this is imagenet pretrained
obs_encoding_size: 512
mha_num_attention_heads: 4
mha_num_attention_layers: 4
mha_ff_dim_factor: 4
late_fusion: False

# normalization for the action space
normalize: True

# context
context_type: temporal
context_size: 5
# tradeoff between action and distance prediction loss
alpha: 0.5

# distance bounds for distance and action and distance predictions 
distance:
  min_dist_cat: 0
  max_dist_cat: 20
action:
  min_dist_cat: 0
  max_dist_cat: 10
close_far_threshold: 10 # distance threshold used to seperate the close and the far  subgoals that are sampled per datapoint

# action output params
len_traj_pred: 5
learn_angle: True

# dataset specific parameters
image_size: [85, 64] # width, height
goal_type: "image"
flip_aug: True
image_aug: True
image_aug_params:
  color_jitter:
    brightness: 0.2
    contrast: 0.2
    saturation: 0.2
    hue: 0.075
    p: 1.0
  gaussian_blur:
    blur_limit: 3
    sigma_limit: 0.03
    p: 0.5
  coarse_dropout:
    num_holes_range: [1, 3]
    hole_height_range: [10, 20]
    hole_width_range: [10, 20]
    p: 0.5

datasets:
  #recon:
