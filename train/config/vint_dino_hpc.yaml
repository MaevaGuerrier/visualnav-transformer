project_name: vint-dino
run_name: vint-5c
freeze_encoders: True
wandb_entity: kobakos
wandb_dir: /home/koki/scratch/vint_training/wandb
log_folder: /home/koki/scratch/vint_training/logs

# training setup
use_wandb: True # set to false if you don't want to log to wandb
train: True
batch_size: 512
epochs: 5
gpu_ids: [0]
num_workers: 16
prefetch_factor: 2
persistent_workers: False
lr: 5.0e-4
optimizer: adamw
clipping: False
max_norm: 1.
scheduler: "cosine_timm"
warmup: True 
warmup_epochs: 1
lr_min: 1.0e-6
warmup_lr_init: 1.0e-6
cyclic_period: 10
plateau_patience: 3
plateau_factor: 0.5
seed: 0

# model params
model_type: vint_dino
obs_encoder: "facebook/dinov3-vits16-pretrain-lvd1689m"
obs_encoding_size: 512
mha_num_attention_heads: 4
mha_num_attention_layers: 6
mha_ff_dim_factor: 4
positional_encoding_type: "rope"

# normalization for the action space
normalize: True

# context
context_type: temporal
context_size: 5
# tradeoff between action and distance prediction loss
alpha: 0.5

# distance bounds for distance and action and distance predictions 
distance:
  min_dist_cat: 0
  max_dist_cat: 20
action:
  min_dist_cat: 0
  max_dist_cat: 10
close_far_threshold: 10 # distance threshold used to seperate the close and the far  subgoals that are sampled per datapoint

# action output params
len_traj_pred: 5
learn_angle: True

# dataset specific parameters
image_size: [192, 192] # width, height
goal_type: "image"
flip_aug: True
image_aug: True
image_aug_params:
  color_jitter:
    brightness: 0.2
    contrast: 0.2
    saturation: 0.2
    hue: 0.075
    p: 1.0
  gaussian_blur:
    blur_limit: 3
    sigma_limit: 0.03
    p: 0.5
  coarse_dropout:
    num_holes_range: [1, 3]
    hole_height_range: [10, 20]
    hole_width_range: [10, 20]
    p: 0.5

datasets:
  go_stanford:
    data_folder: ${SLURM_TMPDIR}/data/go_stanford/
    train: ${SLURM_TMPDIR}/data/data_splits/go_stanford/train
    test: ${SLURM_TMPDIR}/data/data_splits/go_stanford/test
    end_slack: 0
    goals_per_obs: 2 # increase dataset size
    negative_mining: True
  recon:
    data_folder: ${SLURM_TMPDIR}/data/recon/
    train: ${SLURM_TMPDIR}/data/data_splits/recon/train
    test: ${SLURM_TMPDIR}/data/data_splits/recon/test
    end_slack: 3 # because many trajectories end in collisions
    goals_per_obs: 1 # how many goals are sampled per observation
    negative_mining: True # negative mining from the ViNG paper (Shah et al.)
  sacson:
    data_folder: ${SLURM_TMPDIR}/data/huron/
    train: ${SLURM_TMPDIR}/data/data_splits/sacson/train
    test: ${SLURM_TMPDIR}/data/data_splits/sacson/test
    end_slack: 3 # because many trajectories end in collisions
    goals_per_obs: 1
    negative_mining: True
  scand:
    data_folder: ${SLURM_TMPDIR}/data/scand/
    train: ${SLURM_TMPDIR}/data/data_splits/scand/train
    test: ${SLURM_TMPDIR}/data/data_splits/scand/test
    end_slack: 0
    goals_per_obs: 1
    negative_mining: True

# logging stuff
## =0 turns off
print_log_freq: 0 # in iterations
image_log_freq: 0 # in iterations
num_images_log: 8 #0 
pairwise_test_freq: 0 # in epochs
eval_fraction: 0.25
wandb_log_freq: 10 # in iterations
eval_freq: 1 # in epochs
